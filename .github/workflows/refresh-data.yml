name: Refresh roadmap data

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-data.mjs"
      - "scripts/fetch-gcc-roadmap.mjs"
      - "scripts/gcc.mjs"
      - "scripts/fetch-gcc-messagecenter.mjs"
      - "scripts/gcc-messagecenter.mjs"
      - "scripts/graph-cba.mjs"
      - "tests/gcc.test.mjs"
      - "tests/gcc-messagecenter.test.mjs"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test GCC filters and normalization
        run: node --test tests/gcc.test.mjs tests/gcc-messagecenter.test.mjs

      - name: Fetch Microsoft GCC Roadmap data
        id: gcc
        run: node scripts/fetch-gcc-roadmap.mjs

      - name: Fetch real GCC Moderate Message Center notices
        id: gcc_mc
        if: ${{ !cancelled() }}
        env:
          GCC_MC_TENANT_ID: ${{ secrets.GCC_MC_TENANT_ID }}
          GCC_MC_CLIENT_ID: ${{ secrets.GCC_MC_CLIENT_ID }}
          GCC_MC_CERT_PEM: ${{ secrets.GCC_MC_CERT_PEM }}
          GCC_MC_PRIVATE_KEY_PEM: ${{ secrets.GCC_MC_PRIVATE_KEY_PEM }}
        run: node scripts/fetch-gcc-messagecenter.mjs

      - name: Fetch roadmap + Message Center data
        id: legacy
        if: ${{ !cancelled() && (steps.gcc.outcome == 'success' || steps.gcc.outcome == 'failure') }}
        run: node scripts/fetch-data.mjs

      - name: Verify output
        id: verify_legacy
        if: ${{ !cancelled() && steps.legacy.outcome == 'success' }}
        run: |
          test -s data/roadmap.json
          node -e "
            const d = require('./data/roadmap.json');
            if (!Array.isArray(d.items) || d.items.length < 500) {
              console.error('Unexpectedly small dataset:', d.items && d.items.length);
              process.exit(1);
            }
            console.log('OK:', d.items.length, 'items');
          "

      - name: Commit if changed
        if: ${{ !cancelled() && (steps.verify_legacy.outcome == 'success' || steps.gcc.outcome == 'success' || steps.gcc_mc.outcome == 'success') }}
        env:
          GCC_RESULT: ${{ steps.gcc.outcome }}
          GCC_MC_RESULT: ${{ steps.gcc_mc.outcome }}
          LEGACY_RESULT: ${{ steps.verify_legacy.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GCC_RESULT" = success ]; then git add data/gcc-roadmap.json; fi
          if [ "$GCC_MC_RESULT" = success ]; then git add data/gcc-messagecenter.json; fi
          if [ "$LEGACY_RESULT" = success ]; then git add data/roadmap.json; fi
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh roadmap data ($(date -u +%Y-%m-%d))"
            git push
          fi
